<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BIS AI Assistant — Intelligent Assistant for Indian Standards & BIS Services</title>
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-image.png" />
    <style>
      /* Hide the Google Translate Toolbar, Icon, and Tooltips completely */
      .skiptranslate iframe,
      .goog-te-banner-frame,
      .goog-tooltip,
      .goog-tooltip:hover,
      #goog-gt-tt,
      .goog-te-gadget,
      .goog-te-spinner-pos {
        display: none !important;
        visibility: hidden !important;
      }
      body { top: 0px !important; }
      .goog-text-highlight { background-color: transparent !important; box-shadow: none !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="google_translate_element" style="display:none;"></div>
    <script type="text/javascript">
      // FIX FOR REACT CRASHING WITH GOOGLE TRANSLATE (BLANK SCREEN FIX)
      if (typeof Node === 'function' && Node.prototype) {
        const originalRemoveChild = Node.prototype.removeChild;
        Node.prototype.removeChild = function(child) {
          if (child.parentNode !== this) { return child; }
          return originalRemoveChild.apply(this, arguments);
        };
        const originalInsertBefore = Node.prototype.insertBefore;
        Node.prototype.insertBefore = function(newNode, referenceNode) {
          if (referenceNode && referenceNode.parentNode !== this) { return newNode; }
          return originalInsertBefore.apply(this, arguments);
        };
      }
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({pageLanguage: 'en', autoDisplay: false}, 'google_translate_element');
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
